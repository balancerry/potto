<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Trip Wallet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --ink:#1C1B19;
  --ink-soft:#6B6862;
  --paper:#F6F3EC;
  --surface:#FFFFFF;
  --surface-sunk:#EFEBE1;
  --line:#E4DECF;
  --accent:#1F5F4E;
  --accent-soft:#DCEAE4;
  --pos:#2E7D5B;
  --pos-soft:#E2F1E8;
  --neg:#C1552F;
  --neg-soft:#FBEAE1;
  --gold:#B8892B;
  --radius-lg:20px;
  --radius-md:14px;
  --radius-sm:9px;
  --shadow-card:0 1px 2px rgba(28,27,25,0.04), 0 8px 20px -12px rgba(28,27,25,0.18);
  --shadow-pop:0 10px 40px -8px rgba(28,27,25,0.35);
  --font-display:'Fraunces',serif;
  --font-body:'Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#F2EFE6; --ink-soft:#A9A398; --paper:#17160F; --surface:#211F17;
    --surface-sunk:#191811; --line:#332F23; --accent:#5CA98E; --accent-soft:#213229;
    --pos:#5FBF8F; --pos-soft:#1B2E22; --neg:#E08462; --neg-soft:#33201A; --gold:#D9AE5C;
  }
}
:root[data-theme="dark"]{
  --ink:#F2EFE6; --ink-soft:#A9A398; --paper:#17160F; --surface:#211F17;
  --surface-sunk:#191811; --line:#332F23; --accent:#5CA98E; --accent-soft:#213229;
  --pos:#5FBF8F; --pos-soft:#1B2E22; --neg:#E08462; --neg-soft:#33201A; --gold:#D9AE5C;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:flex-start;
}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;}

/* ============ APP FRAME ============ */
#app-frame{
  width:100%;
  max-width:430px;
  min-height:100vh;
  background:var(--paper);
  position:relative;
  display:flex;
  flex-direction:column;
  overflow-x:hidden;
}
@media (min-width:700px){
  body{padding:32px 16px;}
  #app-frame{
    min-height:844px;
    height:844px;
    border-radius:40px;
    box-shadow:var(--shadow-pop);
    border:8px solid var(--ink);
    overflow:hidden;
  }
  #screens{overflow-y:auto;}
}

#screens{
  flex:1;
  overflow-y:auto;
  padding-bottom:96px;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
#screens::-webkit-scrollbar{display:none;}

.screen{display:none; animation:fadeIn .22s ease;}
.screen.active{display:block;}
@keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

/* ============ TOP BAR ============ */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:20px 20px 8px;
  position:sticky; top:0; z-index:5;
  background:var(--paper);
}
.topbar .back-btn{
  width:36px; height:36px; border-radius:50%;
  border:1px solid var(--line); background:var(--surface);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; color:var(--ink); flex-shrink:0;
}
.topbar .back-btn svg{width:18px;height:18px;}
.topbar .title{
  font-family:var(--font-display); font-weight:600; font-size:19px;
  flex:1; text-align:center; letter-spacing:-0.01em;
}
.topbar .spacer{width:36px; flex-shrink:0;}
.topbar .icon-btn{
  width:36px; height:36px; border-radius:50%;
  border:1px solid var(--line); background:var(--surface);
  display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink);
}
.topbar .icon-btn svg{width:17px;height:17px;}

.wordmark{
  font-family:var(--font-display); font-weight:600; font-size:22px; letter-spacing:-0.01em;
  display:flex; align-items:center; gap:8px;
}
.wordmark .mark{
  width:30px;height:30px;border-radius:9px;background:var(--accent);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:700;
  font-family:var(--font-body);
}

/* ============ HOME ============ */
.home-header{padding:8px 20px 4px;}
.home-header .hello{color:var(--ink-soft); font-size:13.5px; margin-top:2px;}
.section-label{
  font-size:12.5px; font-weight:600; color:var(--ink-soft);
  text-transform:uppercase; letter-spacing:0.06em;
  padding:22px 20px 10px;
}
.trip-list{padding:0 20px; display:flex; flex-direction:column; gap:12px;}
.trip-card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg);
  padding:18px 20px; cursor:pointer; box-shadow:var(--shadow-card);
  transition:transform .15s ease, box-shadow .15s ease;
  position:relative; overflow:hidden;
}
.trip-card:active{transform:scale(0.985);}
.trip-card .trip-top{display:flex; justify-content:space-between; align-items:flex-start;}
.trip-card .trip-name{font-family:var(--font-display); font-size:19px; font-weight:600;}
.trip-card .trip-meta{font-size:12.5px; color:var(--ink-soft); margin-top:3px;}
.trip-card .trip-pool{text-align:right;}
.trip-card .trip-pool .lbl{font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em;}
.trip-card .trip-pool .val{font-family:var(--font-display); font-size:20px; font-weight:600; color:var(--accent);}
.trip-card .trip-foot{
  display:flex; align-items:center; justify-content:space-between;
  margin-top:14px; padding-top:12px; border-top:1px solid var(--line);
}
.trip-card .avatars{display:flex;}
.avatar-chip{
  width:26px; height:26px; border-radius:50%; background:var(--accent-soft); color:var(--accent);
  border:2px solid var(--surface); display:flex; align-items:center; justify-content:center;
  font-size:10.5px; font-weight:700; margin-left:-8px;
}
.avatar-chip:first-child{margin-left:0;}
.trip-card .view-link{font-size:13px; font-weight:600; color:var(--accent); display:flex; align-items:center; gap:4px;}

.home-actions{padding:20px 20px 12px; display:flex; gap:10px;}
.btn{
  border:none; border-radius:var(--radius-md); cursor:pointer; font-weight:600;
  display:flex; align-items:center; justify-content:center; gap:7px;
  transition:transform .12s ease, opacity .12s ease;
}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--ink); color:var(--paper); padding:14px 18px; font-size:14.5px; flex:1;}
.btn-secondary{background:var(--surface); color:var(--ink); border:1px solid var(--line); padding:14px 18px; font-size:14.5px; flex:1;}
.btn-full{width:100%;}
.btn-accent{background:var(--accent); color:#fff; padding:14px 18px; font-size:14.5px;}
.btn-ghost{background:transparent; color:var(--ink-soft); padding:10px 14px; font-size:13.5px; border:1px solid var(--line);}
.btn-danger{background:var(--neg-soft); color:var(--neg); padding:12px 16px; font-size:14px;}
.btn:disabled{opacity:.4; cursor:not-allowed;}

/* ============ DASHBOARD ============ */
.pool-hero{
  margin:6px 20px 0; padding:26px 22px 22px; border-radius:24px;
  background:linear-gradient(160deg, var(--ink) 0%, #2A2823 100%);
  color:var(--paper); position:relative; overflow:hidden;
}
:root[data-theme="dark"] .pool-hero, body:not([data-theme="light"]) .pool-hero{
  background:linear-gradient(160deg, #2A3F36 0%, var(--ink) 100%);
}
.pool-hero .trip-title-row{display:flex; justify-content:space-between; align-items:center;}
.pool-hero .trip-title{font-family:var(--font-display); font-size:17px; font-weight:600;}
.pool-hero .trip-sub{font-size:12px; opacity:.65; margin-top:2px;}
.pool-hero .pool-label{font-size:12px; letter-spacing:.04em; opacity:.7; margin-top:20px;}
.pool-hero .pool-amount{font-family:var(--font-display); font-size:42px; font-weight:600; margin-top:2px; letter-spacing:-0.01em;}
.pool-hero .pool-row{display:flex; gap:24px; margin-top:18px;}
.pool-hero .pool-stat .lbl{font-size:11.5px; opacity:.65;}
.pool-hero .pool-stat .val{font-size:15px; font-weight:600; margin-top:2px; font-family:var(--font-display);}
.pool-hero .pool-stat.pos .val{color:#8FE0BB;}
.pool-hero .pool-stat.neg .val{color:#F0A587;}
.info-dot{
  display:inline-flex; align-items:center; justify-content:center;
  width:15px;height:15px;border-radius:50%; background:rgba(255,255,255,.15); font-size:10px; margin-left:5px; cursor:pointer;
}

.quick-actions{display:flex; gap:10px; padding:16px 20px 4px;}

.balance-card{
  margin:14px 20px 0; padding:16px 18px; border-radius:var(--radius-lg);
  background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow-card);
  cursor:pointer;
}
.balance-card .row1{display:flex; justify-content:space-between; align-items:center;}
.balance-card .lbl{font-size:12.5px; color:var(--ink-soft);}
.balance-card .amt{font-family:var(--font-display); font-size:22px; font-weight:600; margin-top:2px;}
.balance-card .amt.pos{color:var(--pos);}
.balance-card .amt.neg{color:var(--neg);}
.balance-card .sub{font-size:12.5px; color:var(--ink-soft); margin-top:3px;}
.chev{color:var(--ink-soft); flex-shrink:0;}

.activity-row{
  display:flex; align-items:center; gap:12px; padding:13px 20px;
  border-bottom:1px solid var(--line); cursor:pointer;
}
.activity-row:active{background:var(--surface-sunk);}
.act-icon{
  width:40px;height:40px;border-radius:12px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-size:16px;
}
.act-icon.contribution{background:var(--pos-soft); color:var(--pos);}
.act-icon.pool_expense{background:var(--neg-soft); color:var(--neg);}
.act-icon.member_expense{background:#EFE6D8; color:var(--gold);}
.act-icon.settlement{background:var(--accent-soft); color:var(--accent);}
.act-body{flex:1; min-width:0;}
.act-title{font-size:14.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.act-sub{font-size:12.5px; color:var(--ink-soft); margin-top:1px;}
.act-amt{font-family:var(--font-display); font-size:15.5px; font-weight:600; flex-shrink:0;}
.act-amt.pos{color:var(--pos);} .act-amt.neg{color:var(--neg);} .act-amt.neutral{color:var(--ink);}

.empty-state{padding:48px 32px; text-align:center; color:var(--ink-soft);}
.empty-state .e-icon{font-size:34px; margin-bottom:10px;}
.empty-state .e-title{font-family:var(--font-display); font-size:17px; color:var(--ink); font-weight:600; margin-bottom:4px;}
.empty-state .e-sub{font-size:13.5px; line-height:1.5;}

/* ============ BOTTOM NAV ============ */
.bottom-nav{
  position:absolute; bottom:0; left:0; right:0; z-index:20;
  background:var(--surface); border-top:1px solid var(--line);
  display:flex; align-items:center; justify-content:space-around;
  padding:8px 4px calc(8px + env(safe-area-inset-bottom, 0px));
}
.nav-item{
  display:flex; flex-direction:column; align-items:center; gap:3px;
  color:var(--ink-soft); cursor:pointer; padding:4px 10px; border-radius:10px; background:none; border:none;
  font-size:10.5px; font-weight:600; width:60px;
}
.nav-item svg{width:21px;height:21px;}
.nav-item.active{color:var(--accent);}
.nav-fab{
  width:52px;height:52px;border-radius:50%; background:var(--ink); color:var(--paper);
  display:flex; align-items:center; justify-content:center; margin-top:-26px;
  box-shadow:0 6px 16px -4px rgba(0,0,0,.4); border:4px solid var(--paper); cursor:pointer;
}
.nav-fab svg{width:22px;height:22px;}

/* ============ SHEETS / MODALS ============ */
.sheet-backdrop{
  position:absolute; inset:0; background:rgba(20,18,14,.5); z-index:50;
  opacity:0; pointer-events:none; transition:opacity .2s ease;
}
.sheet-backdrop.open{opacity:1; pointer-events:auto;}
.sheet{
  position:absolute; left:0; right:0; bottom:0; z-index:51;
  background:var(--surface); border-radius:24px 24px 0 0;
  max-height:88%; overflow-y:auto;
  transform:translateY(100%); transition:transform .28s cubic-bezier(.32,.72,0,1);
  padding-bottom:24px;
}
.sheet.open{transform:translateY(0);}
.sheet-handle{width:36px;height:4px;background:var(--line); border-radius:2px; margin:10px auto 2px;}
.sheet-head{
  display:flex; align-items:center; justify-content:space-between; padding:12px 20px 4px;
}
.sheet-head .sheet-title{font-family:var(--font-display); font-size:18px; font-weight:600;}
.sheet-close{
  width:30px;height:30px;border-radius:50%; background:var(--surface-sunk); border:none;
  display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-soft);
}
.sheet-body{padding:14px 20px 4px;}

/* form */
.field{margin-bottom:16px;}
.field label{display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:6px;}
.field input[type=text], .field input[type=number], .field input[type=date], .field select, .field textarea{
  width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:var(--radius-sm);
  background:var(--surface-sunk); font-size:15px; color:var(--ink); outline:none;
}
.field textarea{resize:none; min-height:60px;}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--accent);}
.field .amt-input-wrap{position:relative;}
.field .amt-input-wrap .rupee{
  position:absolute; left:14px; top:50%; transform:translateY(-50%); font-weight:600; color:var(--ink-soft);
}
.field .amt-input-wrap input{padding-left:28px; font-family:var(--font-display); font-size:19px; font-weight:600;}
.field-error{color:var(--neg); font-size:12px; margin-top:5px; display:none;}
.field.has-error input, .field.has-error select{border-color:var(--neg);}
.field.has-error .field-error{display:block;}

.chip-row{display:flex; flex-wrap:wrap; gap:8px;}
.chip{
  padding:9px 14px; border-radius:20px; border:1px solid var(--line); background:var(--surface);
  font-size:13.5px; font-weight:600; cursor:pointer; color:var(--ink-soft);
}
.chip.selected{background:var(--ink); color:var(--paper); border-color:var(--ink);}

.member-select-row{
  display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--line);
  cursor:pointer;
}
.member-select-row:last-child{border-bottom:none;}
.check-box{
  width:22px;height:22px;border-radius:7px; border:2px solid var(--line); flex-shrink:0;
  display:flex; align-items:center; justify-content:center; transition:all .12s ease;
}
.check-box.checked{background:var(--accent); border-color:var(--accent); color:#fff;}
.msr-name{flex:1; font-size:14.5px; font-weight:500;}
.msr-share{font-size:13px; color:var(--ink-soft); font-variant-numeric:tabular-nums;}
.msr-share-input{width:80px; padding:7px 9px; border:1px solid var(--line); border-radius:8px; background:var(--surface-sunk); font-size:13.5px; text-align:right;}

.split-preview{
  background:var(--surface-sunk); border-radius:var(--radius-md); padding:14px 16px; margin-top:6px;
}
.split-preview .sp-row{display:flex; justify-content:space-between; font-size:13.5px; padding:4px 0;}
.split-preview .sp-total{border-top:1px solid var(--line); margin-top:6px; padding-top:8px; font-weight:700;}
.split-warning{color:var(--neg); font-size:12.5px; margin-top:8px; font-weight:600;}

.form-actions{padding:18px 0 4px; display:flex; gap:10px;}

/* ============ SEGMENTED / FILTERS ============ */
.filter-scroll{display:flex; gap:8px; padding:14px 20px 8px; overflow-x:auto; scrollbar-width:none;}
.filter-scroll::-webkit-scrollbar{display:none;}
.filter-chip{
  padding:8px 14px; border-radius:18px; background:var(--surface); border:1px solid var(--line);
  font-size:13px; font-weight:600; color:var(--ink-soft); white-space:nowrap; cursor:pointer; flex-shrink:0;
}
.filter-chip.active{background:var(--ink); color:var(--paper); border-color:var(--ink);}

.date-divider{padding:16px 20px 6px; font-size:12px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em;}

/* ============ MEMBERS ============ */
.member-row{
  display:flex; align-items:center; gap:13px; padding:14px 20px; border-bottom:1px solid var(--line); cursor:pointer;
}
.member-row:active{background:var(--surface-sunk);}
.m-avatar{
  width:44px;height:44px;border-radius:50%; background:var(--accent-soft); color:var(--accent);
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; flex-shrink:0;
  font-family:var(--font-display);
}
.m-avatar.admin{background:linear-gradient(135deg, var(--gold), #C99A3E); color:#fff;}
.m-body{flex:1; min-width:0;}
.m-name-row{display:flex; align-items:center; gap:6px;}
.m-name{font-size:15px; font-weight:600;}
.m-role-badge{font-size:10px; font-weight:700; color:var(--gold); background:#F3E7C9; padding:2px 7px; border-radius:6px; text-transform:uppercase; letter-spacing:.04em;}
:root[data-theme="dark"] .m-role-badge{background:#3A2F16;}
.m-sub{font-size:12.5px; color:var(--ink-soft); margin-top:1px;}
.m-balance{text-align:right; font-family:var(--font-display); font-weight:600; font-size:15.5px; flex-shrink:0;}

/* ============ SETTLEMENT ============ */
.settle-summary{display:flex; gap:10px; padding:16px 20px 8px;}
.settle-stat{flex:1; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-md); padding:13px 14px; box-shadow:var(--shadow-card);}
.settle-stat .lbl{font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em;}
.settle-stat .val{font-family:var(--font-display); font-size:17px; font-weight:600; margin-top:3px;}

.transfer-card{
  margin:0 20px 10px; padding:15px 16px; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--radius-lg); box-shadow:var(--shadow-card);
}
.transfer-flow{display:flex; align-items:center; gap:10px;}
.tf-avatar{width:36px;height:36px;border-radius:50%; background:var(--surface-sunk); display:flex;align-items:center;justify-content:center; font-size:13px; font-weight:700; font-family:var(--font-display); flex-shrink:0;}
.tf-arrow{color:var(--ink-soft); flex-shrink:0;}
.tf-names{flex:1; font-size:14px; font-weight:600;}
.tf-amt{font-family:var(--font-display); font-size:16px; font-weight:700;}
.transfer-foot{display:flex; align-items:center; justify-content:space-between; margin-top:12px;}
.status-pill{font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:12px; text-transform:uppercase; letter-spacing:.03em;}
.status-pill.pending{background:var(--neg-soft); color:var(--neg);}
.status-pill.paid{background:#F3E7C9; color:var(--gold);}
.status-pill.confirmed{background:var(--pos-soft); color:var(--pos);}
:root[data-theme="dark"] .status-pill.paid{background:#3A2F16;}
.mini-btn{font-size:12.5px; font-weight:700; padding:7px 13px; border-radius:9px; border:1px solid var(--line); background:var(--surface); cursor:pointer; color:var(--ink);}
.mini-btn.primary{background:var(--ink); color:var(--paper); border-color:var(--ink);}

/* ============ DETAIL / TX MODAL ============ */
.detail-hero{padding:6px 20px 18px; text-align:center;}
.detail-hero .d-icon{
  width:56px;height:56px;border-radius:16px; margin:0 auto 12px; display:flex; align-items:center; justify-content:center; font-size:24px;
}
.detail-hero .d-desc{font-family:var(--font-display); font-size:19px; font-weight:600;}
.detail-hero .d-amt{font-family:var(--font-display); font-size:34px; font-weight:700; margin-top:4px;}
.detail-rows{padding:0 20px;}
.detail-row{display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--line); font-size:14px;}
.detail-row .dr-lbl{color:var(--ink-soft);}
.detail-row .dr-val{font-weight:600; text-align:right;}
.split-list{padding:4px 20px 0;}
.split-item{display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line); font-size:14px;}
.split-item .si-name{font-weight:500;}
.split-item .si-amt{font-variant-numeric:tabular-nums; color:var(--ink-soft);}

/* ============ TOAST ============ */
#toast-wrap{position:absolute; bottom:100px; left:0; right:0; z-index:100; display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none;}
.toast{
  background:var(--ink); color:var(--paper); padding:12px 20px; border-radius:30px; font-size:13.5px; font-weight:600;
  box-shadow:0 8px 24px -6px rgba(0,0,0,.4); display:flex; align-items:center; gap:8px;
  animation:toastIn .25s ease, toastOut .25s ease 2.2s forwards;
}
@keyframes toastIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}

'use strict';
/* =========================================================================
   TRIP WALLET — interactive prototype
   Single source of truth: TRIP_WALLET_PRODUCT_SPEC.md
   All money handled internally in integer paise to avoid float errors.
   ========================================================================= */

/* ---------------------------- helpers: money ---------------------------- */
const toPaise = (rupees) => Math.round(Number(rupees) * 100);
const toRupees = (paise) => paise / 100;
function fmtMoney(paise, opts={}){
  const { showSign=false, compact=false } = opts;
  const neg = paise < 0;
  const abs = Math.abs(paise);
  const rupees = abs / 100;
  let str = rupees.toLocaleString('en-IN', { maximumFractionDigits: rupees % 1 === 0 ? 0 : 2 });
  let out = '₹' + str;
  if(neg) out = '-' + out;
  else if(showSign) out = '+' + out;
  return out;
}
function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('en-IN', { day:'numeric', month:'short' });
}
function fmtDateFull(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' });
}
function uid(prefix='id'){ return prefix + '_' + Math.random().toString(36).slice(2,10); }
function initials(name){
  return name.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
}

/* ---------------------------- categories / icons ---------------------------- */

const CATEGORY_ICON = { Stay:'🏨', Food:'🍽️', Transport:'🚕', Activities:'🎯', Tickets:'🎟️', Shopping:'🛍️', Fuel:'⛽', Groceries:'🛒', Drinks:'🥤', Miscellaneous:'✳️' };
const TYPE_ICON = { contribution:'↓', pool_expense:'↑', member_expense:'👤', settlement:'⇄' };
const TYPE_LABEL = { contribution:'Contribution', pool_expense:'Pool Expense', member_expense:'Member Expense', settlement:'Settlement' };

/* =========================================================================
   DEMO DATA SEED
   ========================================================================= */

  const goaTxs = [];
  const pushTx = (tx) => goaTxs.push({ id: uid('tx'), createdAt: tx.date, ...tx });

  // Contributions — everyone contributes 5000, Raj contributes extra 5000 (total 10000)

    pushTx({ tripId:'goa', type:'contribution', description:'Trip contribution', amount:amt,

  const allIds = goaMembers.map(m=>m.id);
  function equalSplit(amount, ids){
    const n = ids.length;
    const base = Math.floor(amount / n);

  // Villa booking — pool expense, all 17

  // Dinner — member-paid, paid by Raj, 4 participants
  const dinnerP = [byName['Raj'].id, byName['Amit'].id, byName['Neha'].id, byName['Karan'].id];
  pushTx({ tripId:'goa', type:'member_expense', description:'Dinner at Thalassa', amount:850000,

    date:'2026-09-17', note:'Sunset dinner', method:null });

  pushTx({ tripId:'goa', type:'pool_expense', description:'Airport Cabs', amount:500000,
    paidBy:null, category:'Transport', participants:allIds, splits:equalSplit(500000, allIds),
    date:'2026-09-17', note:'', method:null });

  // Scuba — only 10 of 17
  const scubaP = allIds.slice(0,10);
  pushTx({ tripId:'goa', type:'pool_expense', description:'Scuba Diving', amount:800000,
    paidBy:null, category:'Activities', participants:scubaP, splits:equalSplit(800000, scubaP),
    date:'2026-09-18', note:'Only 10 joined', method:null });

  // Groceries — member paid by Amit, all participate
  pushTx({ tripId:'goa', type:'member_expense', description:'Groceries & Snacks', amount:270000,
    paidBy: byName['Amit'].id, category:'Groceries', participants:allIds, splits:equalSplit(270000, allIds),
    date:'2026-09-18', note:'', method:null });

  // Club tickets — pool, 12 people
  const clubP = allIds.slice(0,12);

    paidBy:null, category:'Tickets', participants:clubP, splits:equalSplit(600000, clubP),

  // one settlement already recorded
  pushTx({ tripId:'goa', type:'settlement', description:'Settlement', amount:220000,

  // ---- Manali 2027 (smaller trip) ----

  const manaliTxs = [];

  const manaliTrip = {

  // ---- Family Vacation (fresh, mostly empty) ----

  return {

    settlementStatuses: {}, // key: tripId -> { "fromId>toId": status } for generated (non-recorded) transfers

/* =========================================================================
   STATE / PERSISTENCE
   ========================================================================= */
const STORAGE_KEY = 'tripwallet_state_v1';
let STATE = null;

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ STATE = JSON.parse(raw); return; }
  }catch(e){ console.warn('localStorage read failed', e); }
  STATE = buildSeed();
  saveState();
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); }
  catch(e){ console.warn('localStorage write failed', e); }
}
function resetDemoData(){
  STATE = buildSeed();
  saveState();
}

/* =========================================================================
   ACCOUNTING ENGINE
   All pure functions — no DOM. Keep close to spec section 32 rules.
   ========================================================================= */

function getTrip(tripId){ return STATE.trips[tripId]; }
function getTxs(tripId){ return STATE.transactions[tripId] || []; }
function getMember(tripId, memberId){ return getTrip(tripId).members.find(m=>m.id===memberId); }
function memberName(tripId, memberId){ const m = getMember(tripId, memberId); return m ? m.name : '—'; }

// Rule 1/2: Pool balance = contributions - pool_expenses (+ refunds, not modeled yet)
function poolBalance(tripId){
  const txs = getTxs(tripId);
  let total = 0;
  txs.forEach(t=>{
    if(t.type === 'contribution') total += t.amount;
    if(t.type === 'pool_expense') total -= t.amount;
  });
  return total;
}
function totalContributions(tripId){
  return getTxs(tripId).filter(t=>t.type==='contribution').reduce((s,t)=>s+t.amount,0);
}
function totalSpent(tripId){
  // Spent = pool expenses + member-paid expenses (total money the group has consumed)
  return getTxs(tripId).filter(t=>t.type==='pool_expense'||t.type==='member_expense').reduce((s,t)=>s+t.amount,0);
}
function totalPoolExpenses(tripId){
  return getTxs(tripId).filter(t=>t.type==='pool_expense').reduce((s,t)=>s+t.amount,0);
}

// Rule 3/4: member-paid expense does not touch pool; payer gets credit for others' shares.
// Individual settlement balance per member:
//   + contributions made
//   - their own share of every group expense (pool_expense + member_expense)
//   + amount they personally paid for member_expense (full amount, since their own share is already subtracted above)
//   - settlements they paid (as debtor)
//   + settlements they received (as creditor)
function computeBalances(tripId){
  const trip = getTrip(tripId);
  const txs = getTxs(tripId);
  const bal = {};
  trip.members.forEach(m => bal[m.id] = 0);

  txs.forEach(t => {
    if(t.type === 'contribution'){
      bal[t.paidBy] = (bal[t.paidBy]||0) + t.amount;
    }
    else if(t.type === 'pool_expense'){
      (t.splits||[]).forEach(s => { bal[s.memberId] = (bal[s.memberId]||0) - s.amount; });
    }
    else if(t.type === 'member_expense'){
      // payer credited full amount, then debited their own share via the splits loop below
      bal[t.paidBy] = (bal[t.paidBy]||0) + t.amount;
      (t.splits||[]).forEach(s => { bal[s.memberId] = (bal[s.memberId]||0) - s.amount; });
    }
    else if(t.type === 'settlement'){
      // paidBy = debtor who sent money, toMember = creditor who received it
      bal[t.paidBy] = (bal[t.paidBy]||0) + t.amount; // reduces what they owe (moves toward 0 from negative)
      bal[t.toMember] = (bal[t.toMember]||0) - t.amount; // reduces what they're owed
    }
  });
  return bal; // paise, keyed by memberId
}

function balanceExplain(tripId, memberId){
  const txs = getTxs(tripId);
  let contributed = 0, expenseShare = 0, paidForGroup = 0, settlementsSent = 0, settlementsReceived = 0;
  txs.forEach(t=>{
    if(t.type==='contribution' && t.paidBy===memberId) contributed += t.amount;
    if((t.type==='pool_expense' || t.type==='member_expense')){
      const s = (t.splits||[]).find(x=>x.memberId===memberId);
      if(s) expenseShare += s.amount;
    }
    if(t.type==='member_expense' && t.paidBy===memberId) paidForGroup += t.amount;
    if(t.type==='settlement' && t.paidBy===memberId) settlementsSent += t.amount;
    if(t.type==='settlement' && t.toMember===memberId) settlementsReceived += t.amount;
  });
  const net = contributed - expenseShare + paidForGroup + settlementsSent - settlementsReceived;
  return { contributed, expenseShare, paidForGroup, settlementsSent, settlementsReceived, net };
}

// Settlement algorithm: greedy min-transaction matching between debtors/creditors.
function computeSettlementTransfers(tripId){
  const bal = computeBalances(tripId);
  const creditors = [], debtors = [];
  Object.entries(bal).forEach(([id, amt]) => {
    if(amt > 0) creditors.push({ id, amt });
    else if(amt < 0) debtors.push({ id, amt: -amt });
  });
  creditors.sort((a,b)=>b.amt-a.amt);
  debtors.sort((a,b)=>b.amt-a.amt);

  const transfers = [];
  let ci = 0, di = 0;
  const cred = creditors.map(c=>({...c}));
  const debt = debtors.map(d=>({...d}));
  while(ci < cred.length && di < debt.length){
    const c = cred[ci], d = debt[di];
    const amt = Math.min(c.amt, d.amt);
    if(amt > 0){
      transfers.push({ from: d.id, to: c.id, amount: amt });
    }
    c.amt -= amt; d.amt -= amt;
    if(c.amt <= 0) ci++;
    if(d.amt <= 0) di++;
  }
  return transfers;
}

function getSettlementStatus(tripId, from, to){
  const key = from + '>' + to;
  const map = STATE.settlementStatuses[tripId] || {};
  return map[key] || 'pending';
}
function setSettlementStatus(tripId, from, to, status){
  if(!STATE.settlementStatuses[tripId]) STATE.settlementStatuses[tripId] = {};
  STATE.settlementStatuses[tripId][from+'>'+to] = status;
  saveState();
}

function equalSplitAmounts(amountPaise, ids){
  const n = ids.length;
  if(n===0) return [];
  const base = Math.floor(amountPaise / n);
  let remainder = amountPaise - base * n;
  return ids.map((id,idx) => ({ memberId:id, amount: base + (idx < remainder ? 1 : 0) }));
}

/* =========================================================================
   NAVIGATION / ROUTER
   ========================================================================= */
let ROUTE = { screen:'home', tripId:null, params:{} };
let ROUTE_STACK = [];

function navigate(screen, params={}, push=true){
  if(push) ROUTE_STACK.push(JSON.parse(JSON.stringify(ROUTE)));
  ROUTE = { screen, tripId: params.tripId !== undefined ? params.tripId : ROUTE.tripId, params };
  render();
}
function goBack(){
  if(ROUTE_STACK.length===0){ navigate('home', {}, false); return; }
  ROUTE = ROUTE_STACK.pop();
  render();
}

/* =========================================================================
   TOASTS
   ========================================================================= */
function showToast(msg, icon='✓'){
  const wrap = document.getElementById('toast-wrap');
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `<span>${icon}</span><span>${msg}</span>`;
  wrap.appendChild(t);
  setTimeout(()=>t.remove(), 2500);
}

/* =========================================================================
   SHEET (bottom modal) CONTROLLER
   ========================================================================= */
function openSheet(html){
  const sheet = document.getElementById('sheet');
  const backdrop = document.getElementById('sheet-backdrop');
  sheet.innerHTML = html;
  requestAnimationFrame(()=>{
    backdrop.classList.add('open');
    sheet.classList.add('open');
  });
}
function closeSheet(){
  const sheet = document.getElementById('sheet');
  const backdrop = document.getElementById('sheet-backdrop');
  backdrop.classList.remove('open');
  sheet.classList.remove('open');
}
document.getElementById('sheet-backdrop').addEventListener('click', closeSheet);

/* =========================================================================
   RENDER: MAIN DISPATCH
   ========================================================================= */
function render(){
  const el = document.getElementById('screens');
  const bottomNav = document.getElementById('bottom-nav');
  let html = '';
  switch(ROUTE.screen){
    case 'home': html = renderHome(); bottomNav.style.display='none'; break;
    case 'dashboard': html = renderDashboard(ROUTE.tripId); bottomNav.style.display='flex'; break;
    case 'transactions': html = renderTransactions(ROUTE.tripId); bottomNav.style.display='flex'; break;
    case 'members': html = renderMembers(ROUTE.tripId); bottomNav.style.display='flex'; break;
    case 'settlement': html = renderSettlement(ROUTE.tripId); bottomNav.style.display='flex'; break;
    case 'invite': html = renderInvite(ROUTE.tripId); bottomNav.style.display='none'; break;
    case 'join': html = renderJoin(ROUTE.params.code); bottomNav.style.display='none'; break;
    case 'settings': html = renderSettings(ROUTE.tripId); bottomNav.style.display='none'; break;
    default: html = renderHome(); bottomNav.style.display='none';
  }
  el.innerHTML = html;
  el.scrollTop = 0;
  updateNavActive();
}
function updateNavActive(){
  document.querySelectorAll('.nav-item[data-nav]').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.nav === ROUTE.screen);
  });
}

/* =========================================================================
   SCREEN: HOME
   ========================================================================= */
function renderHome(){
  const trips = Object.values(STATE.trips);
  let cards = trips.map(trip => {
    const pool = poolBalance(trip.id);
    const avatars = trip.members.slice(0,4).map(m=>`<div class="avatar-chip">${initials(m.name)}</div>`).join('');

          <div class="trip-name">${trip.name}</div>
          <div class="trip-meta">${trip.members.length} member${trip.members.length!==1?'s':''} · ${fmtDate(trip.startDate)}–${fmtDate(trip.endDate)}</div>
        </div>
        <div class="trip-pool">
          <div class="lbl">Pool</div>
          <div class="val">${fmtMoney(pool)}</div>
        </div>
      </div>
      <div class="trip-foot">
        <div class="avatars">${avatars}${more}</div>
        <div class="view-link">View trip
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>
        </div>
      </div>
    </div>`;
  }).join('');

  if(trips.length===0){
    cards = `<div class="empty-state"><div class="e-icon">🧳</div><div class="e-title">No trips yet</div><div class="e-sub">Create your first trip to start tracking a shared pool.</div></div>`;
  }

  return `
    <div class="topbar" style="justify-content:space-between;">

function submitCreateTrip(){

  const id = uid('trip');
  const memberId = uid('mem');
  const trip = {

function submitJoinTrip(){
  const codeEl = document.getElementById('jt-code');
  const code = codeEl.value.trim().toUpperCase();
  const nameEl = document.getElementById('jt-name');
  const name = nameEl.value.trim();
  const trip = Object.values(STATE.trips).find(t=>t.inviteCode===code);

      <div class="trip-title-row">
        <div><div class="trip-title">${trip.name}</div><div class="trip-sub">${trip.members.length} members</div></div>
      </div>

        <div class="pool-stat pos"><div class="lbl">Contributed</div><div class="val">${fmtMoney(contributed)}</div></div>

      </div>
      <div class="sub">${myBal>=0 ? `You should receive ${fmtMoney(Math.abs(myBal))}` : `You should pay ${fmtMoney(Math.abs(myBal))}`} · tap to see why</div>

function showPoolInfo(){
  openSheet(`
    <div class="sheet-handle"></div>
    <div class="sheet-head"><div class="sheet-title">Pool vs. your balance</div><button class="sheet-close" onclick="closeSheet()">✕</button></div>
    <div class="sheet-body">
      <p class="helper-text" style="padding:0 0 14px;"><strong style="color:var(--ink)">Pool Balance</strong> is the actual money currently sitting in the shared pool — total contributions minus what's been spent directly from the pool.</p>
      <p class="helper-text" style="padding:0 0 14px;"><strong style="color:var(--ink)">Your Balance</strong> (on the dashboard) is different — it's what you should ultimately pay or receive once every expense share, personal payment, and settlement is accounted for. A member-paid expense doesn't touch the pool, but it does change individual balances.</p>
    </div>
  `);
}

function activityRowHtml(tripId, t){
  let title, sub, amt, amtClass, iconCls = t.type, icon = TYPE_ICON[t.type];
  if(t.type==='contribution'){
    title = memberName(tripId, t.paidBy); sub = 'Contribution · ' + fmtDate(t.date);
    amt = fmtMoney(t.amount, {showSign:true}); amtClass='pos';
  } else if(t.type==='pool_expense'){
    title = t.description; sub = 'Pool Expense · ' + fmtDate(t.date);
    amt = '-' + fmtMoney(t.amount); amtClass='neg'; icon = CATEGORY_ICON[t.category]||'💳';
  } else if(t.type==='member_expense'){
    title = t.description; sub = `Paid by ${memberName(tripId,t.paidBy)} · ${fmtDate(t.date)}`;
    amt = fmtMoney(t.amount); amtClass='neutral'; icon = CATEGORY_ICON[t.category]||'👤';
  } else if(t.type==='settlement'){
    title = `${memberName(tripId,t.paidBy)} → ${memberName(tripId,t.toMember)}`; sub = 'Settlement · ' + fmtDate(t.date);
    amt = fmtMoney(t.amount); amtClass='neutral';
  }
  return `
    <div class="activity-row" onclick="openTxDetail('${tripId}','${t.id}')">
      <div class="act-icon ${iconCls}">${icon}</div>
      <div class="act-body"><div class="act-title">${title}</div><div class="act-sub">${sub}</div></div>
      <div class="act-amt ${amtClass}">${amt}</div>
    </div>`;
}

let EXPENSE_DRAFT = null;

function openExpenseSheet(tripId){
  const trip = getTrip(tripId);
  EXPENSE_DRAFT = {
    tripId, expenseKind: 'pool', // 'pool' | 'member'
    participants: trip.members.map(m=>m.id), // default: everyone
    splitMethod: 'equal',
    customAmounts: {}, customPercents: {}
  };
  renderExpenseSheet();
}

function renderExpenseSheet(){
  const tripId = EXPENSE_DRAFT.tripId;
  const trip = getTrip(tripId);
  const memberOptions = trip.members.map(m=>`<option value="${m.id}">${m.name}</option>`).join('');
  const catChips = CATEGORIES.map((c,i)=>`<div class="chip ${i===0?'selected':''}" data-cat="${c}" onclick="selectChip(this)">${CATEGORY_ICON[c]} ${c}</div>`).join('');

  const memberRows = trip.members.map(m=>{
    const checked = EXPENSE_DRAFT.participants.includes(m.id);
    return `
      <div class="member-select-row" onclick="toggleExpenseParticipant('${m.id}')">
        <div class="check-box ${checked?'checked':''}" id="cb-${m.id}">${checked?'✓':''}</div>
        <div class="msr-name">${m.name}</div>
        <div class="msr-share" id="share-${m.id}"></div>
      </div>`;
  }).join('');

  openSheet(`
    <div class="sheet-handle"></div>
    <div class="sheet-head"><div class="sheet-title">Add expense</div><button class="sheet-close" onclick="closeSheet()">✕</button></div>
    <div class="sheet-body">
      <div class="field">
        <label>Expense type</label>
        <div class="chip-row">
          <div class="chip ${EXPENSE_DRAFT.expenseKind==='pool'?'selected':''}" onclick="setExpenseKind('pool')">Pool Expense</div>
          <div class="chip ${EXPENSE_DRAFT.expenseKind==='member'?'selected':''}" onclick="setExpenseKind('member')">Member-Paid</div>
        </div>
        <div class="helper-text" style="padding:8px 0 0;">${EXPENSE_DRAFT.expenseKind==='pool' ? 'Money leaves the common pool directly.' : "A member pays personally — the pool isn't touched, but the payer gets credit."}</div>
      </div>
      <div class="field">
        <label>Description</label>
        <input type="text" id="ae-desc" placeholder="e.g. Dinner">
        <div class="field-error">Enter a description</div>
      </div>
      <div class="field">
        <label>Amount</label>
        <div class="amt-input-wrap"><span class="rupee">₹</span><input type="number" id="ae-amount" placeholder="0" min="0" step="1" oninput="refreshSplitPreview()"></div>
        <div class="field-error">Enter an amount greater than 0</div>
      </div>
      <div class="field" id="ae-paidby-field" style="${EXPENSE_DRAFT.expenseKind==='pool'?'display:none;':''}">
        <label>Paid by</label>
        <select id="ae-paidby">${memberOptions}</select>
      </div>
      <div class="field">
        <label>Category</label>
        <div class="chip-row">${catChips}</div>
      </div>
      <div class="field">
        <label>Participants <span style="font-weight:400; color:var(--ink-soft);">(${EXPENSE_DRAFT.participants.length} selected)</span></label>
        <div style="display:flex; gap:8px; margin-bottom:10px;">
          <button class="mini-btn" onclick="selectAllParticipants(true)">Select all</button>
          <button class="mini-btn" onclick="selectAllParticipants(false)">Clear</button>
        </div>
        <div>${memberRows}</div>
      </div>
      <div class="field">
        <label>Split method</label>
        <div class="chip-row">
          <div class="chip ${EXPENSE_DRAFT.splitMethod==='equal'?'selected':''}" onclick="setSplitMethod('equal')">Equal</div>
          <div class="chip ${EXPENSE_DRAFT.splitMethod==='custom'?'selected':''}" onclick="setSplitMethod('custom')">Custom amount</div>
          <div class="chip ${EXPENSE_DRAFT.splitMethod==='percentage'?'selected':''}" onclick="setSplitMethod('percentage')">Percentage</div>
        </div>
      </div>
      <div class="field">
        <label>Date</label>
        <input type="date" id="ae-date" value="${new Date().toISOString().slice(0,10)}">
      </div>
      <div class="field">
        <label>Note (optional)</label>
        <input type="text" id="ae-note" placeholder="Add a note">
      </div>
      <div class="split-preview" id="split-preview"></div>
      <div class="form-actions">
        <button class="btn btn-primary btn-full" onclick="submitExpense()">Save expense</button>
      </div>
    </div>
  `);
  refreshSplitPreview();
}

function setExpenseKind(kind){
  // preserve current field values before re-render
  captureExpenseFieldValues();
  EXPENSE_DRAFT.expenseKind = kind;
  renderExpenseSheet();
  restoreExpenseFieldValues();
}
function setSplitMethod(method){
  captureExpenseFieldValues();
  EXPENSE_DRAFT.splitMethod = method;
  renderExpenseSheet();
  restoreExpenseFieldValues();
}
function toggleExpenseParticipant(memberId){
  const idx = EXPENSE_DRAFT.participants.indexOf(memberId);
  if(idx>-1) EXPENSE_DRAFT.participants.splice(idx,1);
  else EXPENSE_DRAFT.participants.push(memberId);
  const cb = document.getElementById('cb-'+memberId);
  cb.classList.toggle('checked');
  cb.textContent = cb.classList.contains('checked') ? '✓' : '';
  refreshSplitPreview();
  const label = document.querySelector('#sheet .field label');
}
function selectAllParticipants(all){
  const trip = getTrip(EXPENSE_DRAFT.tripId);
  EXPENSE_DRAFT.participants = all ? trip.members.map(m=>m.id) : [];
  renderExpenseSheet();
}

let EXPENSE_FIELD_CACHE = {};
function captureExpenseFieldValues(){
  EXPENSE_FIELD_CACHE = {
    desc: document.getElementById('ae-desc')?.value,
    amount: document.getElementById('ae-amount')?.value,
    paidby: document.getElementById('ae-paidby')?.value,
    date: document.getElementById('ae-date')?.value,
    note: document.getElementById('ae-note')?.value,
    cat: document.querySelector('#sheet .chip[data-cat].selected')?.dataset.cat
  };
}
function restoreExpenseFieldValues(){
  if(EXPENSE_FIELD_CACHE.desc) document.getElementById('ae-desc').value = EXPENSE_FIELD_CACHE.desc;
  if(EXPENSE_FIELD_CACHE.amount) document.getElementById('ae-amount').value = EXPENSE_FIELD_CACHE.amount;
  if(EXPENSE_FIELD_CACHE.paidby && document.getElementById('ae-paidby')) document.getElementById('ae-paidby').value = EXPENSE_FIELD_CACHE.paidby;
  if(EXPENSE_FIELD_CACHE.date) document.getElementById('ae-date').value = EXPENSE_FIELD_CACHE.date;
  if(EXPENSE_FIELD_CACHE.note) document.getElementById('ae-note').value = EXPENSE_FIELD_CACHE.note;
  if(EXPENSE_FIELD_CACHE.cat){
    document.querySelectorAll('#sheet .chip[data-cat]').forEach(c=>c.classList.toggle('selected', c.dataset.cat===EXPENSE_FIELD_CACHE.cat));
  }
  refreshSplitPreview();
}

function refreshSplitPreview(){
  const preview = document.getElementById('split-preview');
  if(!preview) return;
  const amountEl = document.getElementById('ae-amount');
  const amount = toPaise(parseFloat(amountEl?.value || 0) || 0);
  const ids = EXPENSE_DRAFT.participants;
  const trip = getTrip(EXPENSE_DRAFT.tripId);

  if(ids.length===0){
    preview.innerHTML = `<div class="split-warning">Select at least one participant.</div>`;
    ids.forEach(id=>{ const el=document.getElementById('share-'+id); if(el) el.textContent=''; });
    return;
  }

  let rows = '', warning = '';
  if(EXPENSE_DRAFT.splitMethod === 'equal'){
    const splits = equalSplitAmounts(amount, ids);
    rows = splits.map(s=>`<div class="sp-row"><span>${memberName(trip.id,s.memberId)}</span><span>${fmtMoney(s.amount)}</span></div>`).join('');
    splits.forEach(s=>{ const el=document.getElementById('share-'+s.memberId); if(el) el.textContent = fmtMoney(s.amount); });
  } else if(EXPENSE_DRAFT.splitMethod === 'custom'){
    let sum = 0;
    rows = ids.map(id=>{
      const val = EXPENSE_DRAFT.customAmounts[id] || 0;
      sum += val;
      return `<div class="sp-row"><span>${memberName(trip.id,id)}</span><input type="number" class="msr-share-input" value="${val||''}" placeholder="0" oninput="setCustomAmount('${id}', this.value)"></div>`;
    }).join('');
    ids.forEach(id=>{ const el=document.getElementById('share-'+id); if(el) el.textContent = fmtMoney(toPaise(EXPENSE_DRAFT.customAmounts[id]||0)); });
    const sumPaise = toPaise(sum);
    if(sumPaise !== amount) warning = `Shares total ${fmtMoney(sumPaise)}, but expense is ${fmtMoney(amount)}. These must match.`;
  } else if(EXPENSE_DRAFT.splitMethod === 'percentage'){
    let sumPct = 0;
    rows = ids.map(id=>{
      const val = EXPENSE_DRAFT.customPercents[id] || 0;
      sumPct += val;
      const share = Math.round(amount * val / 100);
      return `<div class="sp-row"><span>${memberName(trip.id,id)}</span><input type="number" class="msr-share-input" value="${val||''}" placeholder="0%" oninput="setCustomPercent('${id}', this.value)"> <span style="margin-left:6px; color:var(--ink-soft); font-size:12.5px;">${fmtMoney(share)}</span></div>`;
    }).join('');
    ids.forEach(id=>{ const el=document.getElementById('share-'+id); const val = EXPENSE_DRAFT.customPercents[id]||0; if(el) el.textContent = (val||0)+'%'; });
    if(Math.round(sumPct) !== 100) warning = `Percentages total ${sumPct}%. They must add up to 100%.`;
  }

  preview.innerHTML = `
    <div style="font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:6px;">Split preview</div>
    ${rows}
    <div class="sp-row sp-total"><span>Total</span><span>${fmtMoney(amount)}</span></div>
    ${warning ? `<div class="split-warning">${warning}</div>` : ''}
  `;
}
function setCustomAmount(id, val){ EXPENSE_DRAFT.customAmounts[id] = parseFloat(val)||0; refreshSplitPreview(); }
function setCustomPercent(id, val){ EXPENSE_DRAFT.customPercents[id] = parseFloat(val)||0; refreshSplitPreview(); }

function submitExpense(){
  const tripId = EXPENSE_DRAFT.tripId;
  const descEl = document.getElementById('ae-desc');
  const amountEl = document.getElementById('ae-amount');
  const desc = descEl.value.trim();
  const rupees = parseFloat(amountEl.value);
  let hasError = false;
  if(!desc){ descEl.closest('.field').classList.add('has-error'); hasError = true; } else descEl.closest('.field').classList.remove('has-error');
  if(!rupees || rupees<=0){ amountEl.closest('.field').classList.add('has-error'); hasError = true; } else amountEl.closest('.field').classList.remove('has-error');
  if(EXPENSE_DRAFT.participants.length===0){ hasError = true; showToast('Select at least one participant', '⚠️'); }
  if(hasError) return;

  const amount = toPaise(rupees);
  const ids = EXPENSE_DRAFT.participants;
  let splits;
  if(EXPENSE_DRAFT.splitMethod === 'equal'){
    splits = equalSplitAmounts(amount, ids);
  } else if(EXPENSE_DRAFT.splitMethod === 'custom'){
    const sumPaise = ids.reduce((s,id)=>s+toPaise(EXPENSE_DRAFT.customAmounts[id]||0),0);
    if(sumPaise !== amount){ showToast('Custom shares must add up to the total', '⚠️'); return; }
    splits = ids.map(id=>({ memberId:id, amount: toPaise(EXPENSE_DRAFT.customAmounts[id]||0) }));
  } else {
    const sumPct = ids.reduce((s,id)=>s+(EXPENSE_DRAFT.customPercents[id]||0),0);
    if(Math.round(sumPct)!==100){ showToast('Percentages must total 100%', '⚠️'); return; }
    splits = ids.map(id=>({ memberId:id, amount: Math.round(amount * (EXPENSE_DRAFT.customPercents[id]||0) / 100) }));
  }

  const category = document.querySelector('#sheet .chip[data-cat].selected')?.dataset.cat || 'Miscellaneous';
  const paidBy = EXPENSE_DRAFT.expenseKind === 'member' ? document.getElementById('ae-paidby').value : null;

  const tx = {
    id: uid('tx'), tripId, type: EXPENSE_DRAFT.expenseKind==='pool' ? 'pool_expense' : 'member_expense',
    description: desc, amount, paidBy, category, participants: ids, splits,
    date: document.getElementById('ae-date').value || new Date().toISOString().slice(0,10),
    note: document.getElementById('ae-note').value.trim(),
    createdAt: new Date().toISOString()
  };
  STATE.transactions[tripId].push(tx);
  saveState();
  closeSheet();
  showToast('Expense added');
  render();
}

function renderSettlement(tripId){
  const trip = getTrip(tripId);
  if(!trip) return renderHome();
  const contributed = totalContributions(tripId);
  const spent = totalSpent(tripId);
  const pool = poolBalance(tripId);
  const bal = computeBalances(tripId);

  const positives = trip.members.filter(m=>(bal[m.id]||0) > 0).sort((a,b)=>bal[b.id]-bal[a.id]);
  const negatives = trip.members.filter(m=>(bal[m.id]||0) < 0).sort((a,b)=>bal[a.id]-bal[b.id]);

  const balRows = (list, sign) => list.map(m=>`
    <div class="member-row" style="cursor:default;">
      <div class="m-avatar">${initials(m.name)}</div>
      <div class="m-body"><div class="m-name">${m.name}</div><div class="m-sub">${sign==='pos'?'Receives':'Pays'}</div></div>
      <div class="m-balance" style="color:${sign==='pos'?'var(--pos)':'var(--neg)'};">${sign==='pos'?'+':''}${fmtMoney(bal[m.id])}</div>
    </div>`).join('');

  const transfers = computeSettlementTransfers(tripId);
  let transferHtml = '';
  if(transfers.length===0){
    transferHtml = `<div class="empty-state"><div class="e-icon">🎉</div><div class="e-title">All settled up</div><div class="e-sub">No transfers are needed right now.</div></div>`;
  } else {
    transferHtml = transfers.map((tr,idx)=>{
      const status = getSettlementStatus(tripId, tr.from, tr.to);
      const fromName = memberName(tripId, tr.from), toName = memberName(tripId, tr.to);
      let actionBtn = '';
      if(status==='pending') actionBtn = `<button class="mini-btn primary" onclick="advanceSettlement('${tripId}','${tr.from}','${tr.to}')">Mark Paid</button>`;
      else if(status==='paid') actionBtn = `<button class="mini-btn primary" onclick="advanceSettlement('${tripId}','${tr.from}','${tr.to}')">Confirm Received</button>`;
      else actionBtn = `<button class="mini-btn" disabled style="opacity:.5;">Confirmed</button>`;
      return `
      <div class="transfer-card">
        <div class="transfer-flow">
          <div class="tf-avatar">${initials(fromName)}</div>
          <svg class="tf-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          <div class="tf-avatar">${initials(toName)}</div>
          <div class="tf-names">${fromName} → ${toName}</div>
          <div class="tf-amt">${fmtMoney(tr.amount)}</div>
        </div>
        <div class="transfer-foot">
          <span class="status-pill ${status}">${status}</span>
          ${actionBtn}
        </div>
      </div>`;
    }).join('');
  }

  return `
    <div class="topbar">
      <button class="back-btn" onclick="navigate('dashboard',{tripId:'${tripId}'})">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="title">Final Settlement</div>
      <div class="spacer"></div>
    </div>
    <div class="settle-summary">
      <div class="settle-stat"><div class="lbl">Contributed</div><div class="val">${fmtMoney(contributed)}</div></div>
      <div class="settle-stat"><div class="lbl">Spent</div><div class="val">${fmtMoney(spent)}</div></div>
      <div class="settle-stat"><div class="lbl">Pool Left</div><div class="val">${fmtMoney(pool)}</div></div>
    </div>
    <div class="section-label">Balances</div>
    <div>${balRows(positives,'pos')}${balRows(negatives,'neg')}</div>
    <div class="section-label">Suggested transfers</div>
    <div class="helper-text" style="padding-bottom:10px;">Minimum transfers needed to settle everyone exactly.</div>
    <div>${transferHtml}</div>
    <div style="height:12px;"></div>
  `;
}
function advanceSettlement(tripId, from, to){
  const cur = getSettlementStatus(tripId, from, to);
  const next = cur==='pending' ? 'paid' : (cur==='paid' ? 'confirmed' : 'confirmed');
  setSettlementStatus(tripId, from, to, next);
  showToast(next==='paid' ? 'Settlement marked as paid' : 'Settlement confirmed');
  render();
}

        <button class="btn btn-danger" style="flex:1;" onclick="doResetDemo()">Reset</button>
      </div>
    </div>
  `);
}
function doResetDemo(){
  resetDemoData();
  closeSheet();
  showToast('Demo data reset');
  navigate('home', {}, false);
}

/* =========================================================================
   FAB — Add Contribution / Add Expense picker
   ========================================================================= */
document.getElementById('fab-add').addEventListener('click', ()=>{
  const tripId = ROUTE.tripId;
  if(!tripId){ showToast('Open a trip first', 'ℹ️'); return; }
  openSheet(`
    <div class="sheet-handle"></div>
    <div class="sheet-head"><div class="sheet-title">Add to ${getTrip(tripId).name}</div><button class="sheet-close" onclick="closeSheet()">✕</button></div>
    <div class="sheet-body" style="padding-bottom:20px;">
      <div style="display:flex; flex-direction:column; gap:10px;">
        <button class="btn btn-accent btn-full" onclick="closeSheet(); openContributionSheet('${tripId}')">+ Add Contribution</button>
        <button class="btn btn-secondary btn-full" onclick="closeSheet(); openExpenseSheet('${tripId}')">+ Add Expense</button>
      </div>
    </div>
  `);
});

/* nav bar clicks */
document.getElementById('bottom-nav').addEventListener('click', (e)=>{
  const btn = e.target.closest('.nav-item[data-nav]');
  if(!btn) return;
  const tripId = ROUTE.tripId;
  if(!tripId) return;
  navigate(btn.dataset.nav, { tripId });
});

/* =========================================================================
   INIT
   ========================================================================= */
(function init(){
  const savedTheme = localStorage.getItem('tripwallet_theme');
  if(savedTheme && savedTheme!=='system') document.documentElement.setAttribute('data-theme', savedTheme);
  loadState();
  navigate('home', {}, false);
})();
</script>
</body>
</html>
